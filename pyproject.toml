[project]
name = "code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bertopic>=0.17.4",
    "gensim>=4.4.0",
    "hdbscan>=0.8.44",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pymupdf>=2.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.11.0",
    "umap-learn>=0.5.12",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
